[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udeets-api"
version = "0.1.0"
description = "FastAPI backend for UDeets"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "boto3>=1.39.8",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic-settings>=2.6.1",
  "psycopg[binary]>=3.2.3",
  "pyjwt[crypto]>=2.10.1",
  "argon2-cffi>=23.1.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.1",
  "redis[hiredis]>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
